<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yceffort: number-flow 비교 데모</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        background: #f5f5f5;
      }
      h1 {
        font-size: 1.2rem;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
      .panel {
        background: #fff;
        border-radius: 8px;
        padding: 0.75rem;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
      }
      .panel h2 {
        font-size: 0.85rem;
        color: #666;
        margin: 0 0 0.5rem;
      }
      iframe {
        width: 100%;
        height: 130px;
        border: none;
      }
    </style>
  </head>
  <body>
    <h1>yceffort: number-flow — 네이티브(WAAPI) vs rAF 폴백 vs 원본 비교</h1>
    <div class="controls">
      <button data-op="inc">+1</button>
      <button data-op="dec">−1</button>
      <button data-op="big">+123,456</button>
      <button data-op="shrink">÷100</button>
      <button data-op="random">랜덤</button>
      <button data-op="negate">부호 반전</button>
      <button data-op="interrupt">인터럽트 연타</button>
      <button data-op="ticker">실시간 티커 시작</button>
      <button data-op="reset">리셋</button>
    </div>
    <div class="panels">
      <div class="panel">
        <h2>ours — 자동 (이 브라우저에선 네이티브 WAAPI)</h2>
        <iframe id="native" src="/panel.html?impl=ours&engine=auto"></iframe>
      </div>
      <div class="panel">
        <h2>ours — rAF 폴백 강제 (구형 브라우저 경로)</h2>
        <iframe id="raf" src="/panel.html?impl=ours&engine=raf"></iframe>
      </div>
      <div class="panel">
        <h2>원본 @number-flow/react</h2>
        <iframe id="original" src="/panel.html?impl=original"></iframe>
      </div>
    </div>
    <script>
      let value = 12345.6
      const broadcast = () => {
        document.querySelectorAll('iframe').forEach((f) => {
          f.contentWindow?.postMessage({type: 'value', value}, '*')
        })
      }
      const ops = {
        inc: () => (value += 1),
        dec: () => (value -= 1),
        big: () => (value += 123456),
        shrink: () => (value = Math.round(value) / 100),
        random: () => (value = Math.random() * 1e6 - 1e5),
        negate: () => (value = -value),
        reset: () => (value = 12345.6),
        interrupt: () => {
          // 애니메이션 도중 값 재변경 (accumulate 합성 검증):
          ;[0, 250, 500].forEach((delay, i) =>
            setTimeout(() => {
              value += [98765, -1234, 4321][i]
              broadcast()
            }, delay),
          )
        },
        ticker: () => {
          // 실시간 시세처럼 계속 바뀌는 값 (연속 인터럽트):
          const btn = document.querySelector('[data-op="ticker"]')
          if (tickerId) {
            clearInterval(tickerId)
            tickerId = null
            btn.textContent = '실시간 티커 시작'
          } else {
            tickerId = setInterval(() => {
              value += (Math.random() - 0.48) * 5000
              broadcast()
            }, 150)
            btn.textContent = '실시간 티커 정지'
          }
        },
      }
      let tickerId = null
      const noBroadcast = new Set(['interrupt', 'ticker'])
      document.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          ops[btn.dataset.op]()
          if (!noBroadcast.has(btn.dataset.op)) broadcast()
        })
      })
      // iframe 로드 직후 초기값 동기화:
      window.addEventListener('message', (e) => {
        if (e.data?.type === 'ready') broadcast()
      })
    </script>
  </body>
</html>
